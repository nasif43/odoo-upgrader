[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-upgrader"
version = "1.0.0"
description = "Autonomous Odoo Module Upgrade, Transformation, and Validation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Metamorphosis Ltd", email = "info@metamorphosis.com.bd" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
odoo-upgrader = "odoo_upgrader.cli:main"
upgrade-odoo = "odoo_upgrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
